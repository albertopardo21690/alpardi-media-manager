[project]
name = "alpardi-media-manager"
version = "0.1.0"
description = "Gestor multimedia conversacional para Plex, controlado desde Claude Code (CLI + MCP stdio, sin panel web)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }

dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[project.scripts]
alpardi-media = "alpardi_media_manager.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: prueba real contra Plex/NAS reales, sin mocks (requiere red/SSH disponibles)",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
